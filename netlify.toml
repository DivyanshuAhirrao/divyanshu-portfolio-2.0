[build]
  command = "npm run build"
  publish = "dist/client"

[functions]
  directory = ".netlify/v1/functions"

# Nitro's "netlify" preset already writes redirect rules into dist/client/_redirects
# during build (routing static assets directly, everything else to the SSR function).
# This file's only job is to tell Netlify how to build and where the static
# output lives — do not add a catch-all redirect here, it would fight the
# generated _redirects file and can serve stale/static HTML instead of SSR output.

[build.environment]
  # nitro@3 (beta, currently pinned in package.json) requires ^20.19.0 || >=22.12.0.
  # Using 22 LTS gives headroom above nitro's minimum rather than sitting right on it.
  NODE_VERSION = "22"